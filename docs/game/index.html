<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Undrafted</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Graduate&amp;display=swap" rel="stylesheet" />
<style>
/* Layout: the story is written on a coach's graph-paper play sheet; a dark trading-card player card rides beside it; an amber LED scoreboard appears at game time; mini-games happen on a strip of turf. */
:root {
  --field: #E3EAE0;
  --field-line: rgba(21, 33, 58, .055);
  --sheet: #FCFDFB;
  --grid: rgba(38, 84, 160, .065);
  --ink: #14203A;
  --muted: #58647A;
  --line: #C9D3C8;
  --pylon: #D2500A;
  --pylon-ink: #FFFFFF;
  --pylon-soft: rgba(223, 85, 10, .12);
  --good: #23763F;
  --warn: #946C00;
  --bad: #BE3229;
  --board: #121A16;
  --board-2: #1C2822;
  --board-ink: #E9EEE7;
  --board-muted: #93A096;
  --led: #FFB21E;
  --turf-a: #2E6E3E;
  --turf-b: #245A32;
  --chalk: #FFFFFF;
  --chalk-dim: rgba(255, 255, 255, .72);
  --m-skill: #FF7A2E;
  --m-conf: #FFB21E;
  --m-energy: #5BD68A;
  --m-fame: #E9EEE7;
  --m-chem: #69C3E6;
  --m-neg: #FF6E61;
  --shadow: 0 1px 0 rgba(20, 32, 58, .05), 0 14px 32px -18px rgba(20, 32, 58, .35);
  --f-display: 'Graduate', 'Rockwell', 'Roboto Slab', Georgia, serif;
  --f-body: 'Barlow', 'Segoe UI', Roboto, system-ui, sans-serif;
  --f-label: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --field: #0B120E;
    --field-line: rgba(233, 239, 231, .035);
    --sheet: #121C17;
    --grid: rgba(150, 205, 170, .045);
    --ink: #E6ECE4;
    --muted: #98A59B;
    --line: #26352C;
    --pylon: #FF7A2E;
    --pylon-ink: #160800;
    --pylon-soft: rgba(255, 122, 46, .15);
    --good: #4FC27A;
    --warn: #E6BB3A;
    --bad: #FF6E61;
    --board: #070C09;
    --board-2: #111A15;
    --turf-a: #1C4B2A;
    --turf-b: #153D21;
    --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 14px 32px -18px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --field: #0B120E;
  --field-line: rgba(233, 239, 231, .035);
  --sheet: #121C17;
  --grid: rgba(150, 205, 170, .045);
  --ink: #E6ECE4;
  --muted: #98A59B;
  --line: #26352C;
  --pylon: #FF7A2E;
  --pylon-ink: #160800;
  --pylon-soft: rgba(255, 122, 46, .15);
  --good: #4FC27A;
  --warn: #E6BB3A;
  --bad: #FF6E61;
  --board: #070C09;
  --board-2: #111A15;
  --turf-a: #1C4B2A;
  --turf-b: #153D21;
  --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 14px 32px -18px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--field);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--field-line) calc(10% - 1px) 10%);
  z-index: 0;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pylon); outline-offset: 2px; }
kbd {
  font-family: var(--f-label);
  font-weight: 700;
  font-size: .82em;
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid currentColor;
  opacity: .9;
}

#app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  padding-block: 10px;
  padding-inline: 16px;
  background: var(--field);
  border-bottom: 1px solid var(--line);
}
.brand {
  font-family: var(--f-display);
  font-size: 19px;
  letter-spacing: .04em;
  background: none;
  border: 0;
  padding: 4px 0;
  cursor: pointer;
  color: var(--ink);
}
.brand span { color: var(--pylon); }
.status {
  flex: 1;
  min-width: 0;
  font-family: var(--f-label);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.top-actions { display: flex; gap: 8px; }
.tbtn {
  font-family: var(--f-label);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: .06em;
  text-transform: uppercase;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
}
.tbtn:hover { border-color: var(--pylon); }

.wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 56px; }
.wrap.narrow { max-width: 760px; }

/* ---------- Title screen ---------- */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: 14px;
  background: linear-gradient(180deg, var(--turf-a), var(--turf-b));
  color: var(--chalk);
  box-shadow: var(--shadow);
}
.hero-field {
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(255, 255, 255, .28) calc(10% - 2px) 10%),
    repeating-linear-gradient(180deg, rgba(255, 255, 255, .025) 0 40px, transparent 40px 80px);
}
.yardnums {
  position: absolute;
  left: 0; right: 0; bottom: 14px;
  display: flex;
  justify-content: space-around;
  font-family: var(--f-display);
  font-size: clamp(16px, 3vw, 30px);
  color: rgba(255, 255, 255, .32);
  padding-inline: 4%;
  pointer-events: none;
}
.hero-inner { position: relative; padding: clamp(28px, 6vw, 64px) clamp(20px, 5vw, 56px) clamp(64px, 9vw, 96px); max-width: 760px; }
.eyebrow {
  font-family: var(--f-label);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--led);
}
.logo {
  font-family: var(--f-display);
  font-weight: 400;
  font-size: clamp(48px, 11vw, 116px);
  line-height: .92;
  letter-spacing: .01em;
  margin: 10px 0 18px;
  text-shadow: 0 4px 0 var(--pylon), 0 10px 30px rgba(0, 0, 0, .35);
  text-transform: uppercase;
}
.tagline { font-size: clamp(17px, 2.1vw, 20px); max-width: 52ch; margin: 0 0 26px; color: var(--chalk); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
.pylon-mark {
  position: absolute;
  right: clamp(16px, 5vw, 56px);
  top: clamp(20px, 5vw, 48px);
  width: 22px;
  height: 64px;
  background: var(--pylon);
  border-radius: 3px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .3);
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--f-label);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 12px 22px;
  border-radius: 8px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform .12s ease, background-color .12s ease;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--pylon); color: var(--pylon-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: rgba(0, 0, 0, .18); color: var(--chalk); border-color: rgba(255, 255, 255, .55); }
.btn-ghost:hover { background: rgba(0, 0, 0, .3); }
.btn-plain { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-plain:hover { border-color: var(--pylon); }
.btn small { font-family: var(--f-body); font-weight: 500; font-size: 13px; letter-spacing: 0; text-transform: none; opacity: .85; }

.how {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin-top: 22px;
}
.how > div {
  background: var(--sheet);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 20px;
  min-width: 0;
}
.how h3 { font-family: var(--f-display); font-weight: 400; font-size: 20px; margin: 0 0 6px; }
.how p { margin: 0; color: var(--muted); font-size: 16px; }
.how-games { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  display: inline-block;
  font-family: var(--f-label);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--pylon-soft);
  color: var(--ink);
}
.foot-note { margin-top: 18px; color: var(--muted); font-size: 14px; text-align: center; }

/* ---------- Setup ---------- */
.sheet {
  background-color: var(--sheet);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: clamp(20px, 4vw, 36px) clamp(18px, 4vw, 40px);
  box-shadow: var(--shadow);
  min-width: 0;
}
.kicker {
  font-family: var(--f-label);
  text-transform: uppercase;
  letter-spacing: .14em;
  font-size: 14px;
  color: var(--pylon);
  font-weight: 700;
}
.title {
  font-family: var(--f-display);
  font-weight: 400;
  font-size: clamp(26px, 4.4vw, 40px);
  line-height: 1.08;
  margin: 6px 0 18px;
  text-wrap: balance;
}
.form-grid { display: grid; gap: 22px; }
.name-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
.lbl {
  display: block;
  font-family: var(--f-label);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.txt {
  width: 100%;
  font: inherit;
  font-size: 18px;
  font-weight: 600;
  padding: 10px 12px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  background: var(--sheet);
  color: var(--ink);
}
.txt:focus { border-color: var(--pylon); outline: none; box-shadow: 0 0 0 3px var(--pylon-soft); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; }
.opt-grid { display: grid; gap: 10px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.opt-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt { position: relative; display: block; cursor: pointer; min-width: 0; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt-body {
  display: block;
  height: 100%;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  background: var(--sheet);
  transition: border-color .12s ease, box-shadow .12s ease;
}
.opt:hover .opt-body { border-color: var(--muted); }
.opt input:checked + .opt-body { border-color: var(--pylon); box-shadow: 0 0 0 3px var(--pylon-soft); }
.opt input:focus-visible + .opt-body { outline: 3px solid var(--pylon); outline-offset: 2px; }
.opt-big { font-family: var(--f-display); font-size: 28px; line-height: 1; display: block; }
.opt-name { font-weight: 700; display: block; margin-top: 4px; }
.opt-desc { font-size: 14.5px; color: var(--muted); display: block; margin-top: 4px; line-height: 1.4; }
.opt-tag { display: block; margin-top: 8px; font-family: var(--f-label); font-weight: 600; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--pylon); }
.num-row { display: flex; flex-wrap: wrap; gap: 8px; }
.num-row .opt-body { font-family: var(--f-display); font-size: 22px; padding: 8px 14px; min-width: 64px; text-align: center; }

/* ---------- Play layout ---------- */
.play { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.story p { margin: 0 0 .95em; max-width: 64ch; }
.story p.say { margin-top: 1.1em; }
.story .who {
  display: block;
  font-family: var(--f-label);
  font-weight: 700;
  font-size: 13.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--pylon);
  margin-bottom: 1px;
}
.story .note {
  font-family: var(--f-label);
  font-weight: 600;
  font-size: 16px;
  letter-spacing: .02em;
  color: var(--muted);
}
.story .warn { color: var(--warn); font-weight: 600; }
.story em { font-style: italic; }
.reveal > * { animation: rise .45s ease both; }
.reveal > *:nth-child(2) { animation-delay: .07s; }
.reveal > *:nth-child(3) { animation-delay: .14s; }
.reveal > *:nth-child(4) { animation-delay: .21s; }
.reveal > *:nth-child(5) { animation-delay: .28s; }
.reveal > *:nth-child(n+6) { animation-delay: .35s; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.choices { display: grid; gap: 10px; margin-top: 22px; }
.choice {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  width: 100%;
  text-align: left;
  padding: 13px 16px;
  border: 1.5px solid var(--line);
  background: var(--sheet);
  color: var(--ink);
  border-radius: 8px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color .12s ease;
}
.choice:hover:not([disabled]) { border-color: var(--pylon); }
.choice .k { transition: transform .12s ease; }
.choice:hover:not([disabled]) .k { transform: translateX(3px); }
.choice[disabled] { opacity: .5; cursor: not-allowed; }
.choice .k {
  flex: none;
  font-family: var(--f-label);
  font-weight: 700;
  font-size: 14px;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 5px;
  background: var(--ink);
  color: var(--sheet);
  margin-top: 1px;
}
.choice .t { min-width: 0; }
.choice small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.choice.primary { background: var(--pylon); border-color: var(--pylon); color: var(--pylon-ink); font-family: var(--f-label); font-weight: 700; font-size: 19px; letter-spacing: .06em; text-transform: uppercase; align-items: center; }
.choice.primary .k { background: var(--pylon-ink); color: var(--pylon); }
.choice.primary small { color: inherit; opacity: .88; font-family: var(--f-body); font-weight: 500; font-size: 14.5px; letter-spacing: 0; text-transform: none; }
.choice.primary:hover { filter: brightness(1.06); }

/* ---------- Scoreboard ---------- */
.board {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  background: var(--board);
  color: var(--board-ink);
  border-radius: 8px;
  padding: 10px 14px;
  margin: 0 0 18px;
  border: 1px solid var(--line);
}
.bteam { display: flex; align-items: center; gap: 12px; min-width: 0; }
.bteam.right { justify-content: flex-end; }
.bname { font-family: var(--f-display); font-size: clamp(13px, 2.2vw, 17px); text-transform: uppercase; letter-spacing: .03em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bscore {
  font-family: var(--f-label);
  font-weight: 700;
  font-size: clamp(30px, 5vw, 40px);
  line-height: 1;
  color: var(--led);
  text-shadow: 0 0 12px rgba(255, 178, 30, .45);
  font-variant-numeric: tabular-nums;
  min-width: 2ch;
  text-align: center;
}
.bmid { font-family: var(--f-label); font-weight: 700; letter-spacing: .1em; color: var(--board-muted); font-size: 14px; text-align: center; text-transform: uppercase; }

.matchup {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: center;
  background: var(--board);
  color: var(--board-ink);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 18px;
  border: 1px solid var(--line);
}
.mu-side { min-width: 0; }
.mu-side.right { text-align: right; }
.mu-team { font-family: var(--f-display); font-size: clamp(15px, 2.6vw, 20px); text-transform: uppercase; line-height: 1.1; }
.mu-sub { font-family: var(--f-label); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--board-muted); font-size: 13px; margin-top: 4px; }
.mu-vs { font-family: var(--f-display); color: var(--led); font-size: 18px; }
.threat { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 4px; }
.threat i { width: 8px; height: 10px; border-radius: 2px; background: rgba(255, 255, 255, .15); }
.threat i.on { background: var(--led); }

.grade {
  display: inline-grid;
  place-items: center;
  font-family: var(--f-display);
  font-size: 26px;
  width: 54px;
  height: 54px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--sheet);
  vertical-align: middle;
  margin-right: 12px;
}
.grade-row { display: flex; align-items: center; margin: 4px 0 16px; }
.grade-row div { min-width: 0; }

/* ---------- Week hub ---------- */
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 8px; }
.act {
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: left;
  padding: 14px 16px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--sheet);
  color: var(--ink);
  cursor: pointer;
  min-width: 0;
  transition: border-color .12s ease, box-shadow .12s ease;
}
.act:hover:not([disabled]) { border-color: var(--pylon); box-shadow: 0 0 0 3px var(--pylon-soft); }
.act[disabled] { opacity: .45; cursor: not-allowed; }
.act.picked { border-color: var(--good); opacity: 1; box-shadow: 0 0 0 3px rgba(35, 118, 63, .15); }
.act-top { display: flex; align-items: center; gap: 8px; }
.act-name { font-family: var(--f-display); font-size: 18px; line-height: 1.1; flex: 1; min-width: 0; }
.act-desc { font-size: 15px; color: var(--muted); line-height: 1.4; }
.act-fx { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; padding-top: 4px; }
.fxc { font-family: var(--f-label); font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; }
.fxc.up { background: rgba(35, 118, 63, .14); color: var(--good); }
.fxc.down { background: rgba(190, 50, 41, .12); color: var(--bad); }
.fxc.lock { background: var(--pylon-soft); color: var(--ink); }
.picks-left { font-family: var(--f-label); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--pylon); }
.hub-log { margin-top: 16px; display: grid; gap: 8px; }
.hub-log p { margin: 0; padding: 10px 14px; border-radius: 8px; background: var(--pylon-soft); font-size: 16px; }
.hub-log b { font-family: var(--f-label); letter-spacing: .06em; text-transform: uppercase; }

/* ---------- Player card ---------- */
.card {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 72px);
  background: var(--board);
  color: var(--board-ink);
  border-radius: 12px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.pc-head { display: flex; gap: 14px; align-items: center; padding: 16px 18px 12px; background: linear-gradient(135deg, var(--board-2), var(--board)); border-bottom: 1px solid rgba(255, 255, 255, .08); }
.pc-num { font-family: var(--f-display); font-size: 44px; line-height: 1; color: var(--m-skill); min-width: 2ch; text-align: center; }
.pc-name { font-family: var(--f-display); font-size: 19px; line-height: 1.1; text-transform: uppercase; overflow-wrap: anywhere; }
.pc-role { font-family: var(--f-label); font-weight: 600; font-size: 13.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--board-muted); margin-top: 3px; }
.pc-body { padding: 14px 18px 18px; display: grid; gap: 14px; }
.pc-sec { display: grid; gap: 8px; }
.pc-h { font-family: var(--f-label); font-weight: 700; font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--board-muted); }
.meter-row { display: grid; grid-template-columns: 102px 1fr 30px; gap: 8px; align-items: center; font-size: 14px; }

@media (max-width: 880px) {

  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }

<body>
<div id="app">
  <header class="topbar">
    <button class="brand" id="brandBtn" type="button" aria-label="Undrafted title screen">UNDRAFTED<span>.</span></button>
    <div class="status" id="status"></div>
    <div class="top-actions">
      <button class="tbtn" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
      <button class="tbtn" id="menuBtn" type="button" hidden>Menu</button>
    </div>

  <div id="toasts" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* =========================================================
   UNDRAFTED — a football story game.
   Everything (story, mini-games, saving) lives in this file.
   ========================================================= */

// ---------- Small helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const chance = p => Math.random() < p;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// Browser storage can be missing or blocked, so every call is wrapped.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
};
const SAVE_KEY = 'undrafted.save.v1';
const TROPHY_KEY = 'undrafted.trophies.v1';
const PREF_KEY = 'undrafted.prefs.v1';

// ---------- Sound (tiny synth, no files needed) ----------
const Sound = (() => {
  let ctx = null;
  let on = store.get(PREF_KEY, {}).sound !== false;
  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { ctx = new C(); } catch (e) { return null; }
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function tone(f, d, type, vol, t0, slide) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + (t0 || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + d + 0.03);
  }
  function noise(d, vol, t0, freq) {
    const c = ac(); if (!c) return;
    const len = Math.floor(c.sampleRate * d);
    const buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / len);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 900; f.Q.value = 0.6;
    const g = c.createGain(); g.gain.value = vol || 0.05;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(c.currentTime + (t0 || 0));
  }
  const fx = {
    click: () => tone(520, 0.05, 'triangle', 0.035),
    tick: () => tone(900, 0.04, 'square', 0.025),
    good: () => { tone(523, 0.12, 'triangle', 0.06); tone(784, 0.2, 'triangle', 0.06, 0.08); },
    great: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.24, 'triangle', 0.06, i * 0.07)); noise(1.2, 0.07, 0.05, 800); },
    bad: () => tone(190, 0.32, 'sawtooth', 0.045, 0, -80),
    whistle: () => { tone(2200, 0.32, 'sine', 0.04, 0, 120); tone(2350, 0.18, 'sine', 0.025, 0.06, -80); },
    trophy: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.28, 'sine', 0.05, i * 0.09)),
    cash: () => { tone(1320, 0.07, 'square', 0.025); tone(1760, 0.12, 'square', 0.025, 0.06); },
  };
  return {
    play(n) { if (on && fx[n]) { try { fx[n](); } catch (e) { /* ignore */ } } },
    get on() { return on; },
    toggle() { on = !on; const p = store.get(PREF_KEY, {}); p.sound = on; store.set(PREF_KEY, p); if (on) ac(); return on; },
  };
})();

// ---------- Who you can be ----------
const POS = {
  QB: { name: 'Quarterback', nums: [3, 7, 12, 16], games: ['Reads', 'Throws', 'Scrambles'],
        blurb: 'Read the defense, fire into tight windows, escape the rush.', verb: 'throw',
        stats: [['passYds', 'Pass yds'], ['td', 'TD'], ['int', 'INT']],
        train: 'You throw two hundred extra balls at a trash can forty yards away. By the end you hit it eleven times in a row.' },
  RB: { name: 'Running Back', nums: [22, 26, 28, 33], games: ['Cuts', 'Jukes', 'Blitz pickup'],
        blurb: 'Find the hole, juke the linebacker, dive for the pylon.', verb: 'run',
        stats: [['rushYds', 'Rush yds'], ['td', 'TD'], ['long', 'Long']],
        train: 'You push the blocking sled until your legs shake. Then you push it again, because Okafor is watching.' },
  WR: { name: 'Wide Receiver', nums: [11, 14, 17, 84], games: ['Releases', 'Catches', 'Option routes'],
        blurb: 'Beat press coverage, toe-tap the sideline, high-point the fade.', verb: 'catch',
        stats: [['rec', 'Catches'], ['recYds', 'Rec yds'], ['td', 'TD']],
        train: 'The JUGS machine fires three hundred balls at you. You drop four. You think about those four all night.' },
  LB: { name: 'Linebacker', nums: [44, 52, 54, 58], games: ['Snap timing', 'Run reads', 'Tackles'],
        blurb: 'Diagnose the play, shed blockers, punch the ball loose.', verb: 'tackle',
        stats: [['tkl', 'Tackles'], ['sacks', 'Sacks'], ['take', 'Takeaways']],
        train: 'You hit the tackling sled until the pad on it splits down the middle. The equipment guy sighs.' },
};
const POSCOACH = { QB: 'quarterbacks coach', RB: 'running backs coach', WR: 'wide receivers coach', LB: 'linebackers coach' };
const VANE_NUM = { QB: 9, RB: 32, WR: 81, LB: 55 };
const INJ = { QB: 'steps up in the pocket to throw', RB: 'cuts back on a sweep', WR: 'goes up for a contested catch', LB: 'fills a gap on a run play' };

const ORIGINS = {
  town: { name: 'Small town', where: "Cutter's Ford, Kansas", fam: 'Grandma Bea', fp: 'she', fpos: 'her', fobj: 'her',
          blurb: 'Raised by Grandma Bea above the Bluebird Diner. Population 2,140, and every one of them watches your games.',
          bonus: { conf: 5, chem: 6 }, tag: '+Confidence, +Chemistry' },
  city: { name: 'Harbor City kid', where: 'the east side of Harbor City', fam: 'Mom', fp: 'she', fpos: 'her', fobj: 'her',
          blurb: 'You grew up eleven miles from the Hammerheads stadium. Your mom works nights as an ER nurse.',
          bonus: { fame: 10, conf: 4 }, tag: '+Fame, +Confidence' },
  base: { name: 'Military family', where: 'six Army bases in twelve years', fam: 'Dad', fp: 'he', fpos: 'his', fobj: 'him',
          blurb: 'Your dad, a retired Army sergeant, taught you to be early, be ready, and make your bed.',
          bonus: { skill: 5, energy: 10 }, tag: '+Skill, +Energy' },
};

const FIRST_NAMES = ['Jordan', 'Malik', 'Tyler', 'Andre', 'Cody', 'Dev', 'Mateo', 'Isaiah', 'Sam', 'Kai', 'Darius', 'Luke', 'Theo', 'Jalen', 'Eli', 'Marco', 'Nate', 'Rashad', 'Cole', 'Diego'];
const LAST_NAMES = ['Reyes', 'Brooks', 'Okoye', 'Hart', 'Delgado', 'Whitfield', 'Mercer', 'Banks', 'Kowalski', 'Tran', 'Ellison', 'Price', 'Navarro', 'Shaw', 'Bishop', 'Castillo', 'Abernathy', 'Greene', 'Holt', 'Sato'];

// ---------- The season ----------
const SCHEDULE = [

const FAMILY_RICH = {

};
const FAMILY_MODEST = {
  town: `Grandma Bea frames your first game check stub and hangs it in the diner, right above the register.`,

// =========================================================
//   ENGINE
// =========================================================
let S = null;          // the whole career (saved to the browser)
let screen = 'title';  // title | setup | trophies | play
let curPage = null;
let busy = false;
let mini = null;       // the running mini-game, if any
let menuKilledMini = false;
let trophyBack = 'title';

function newState(cfg) {
  const s = {
    v: 1, first: cfg.first, last: cfg.last, pos: cfg.pos, origin: cfg.origin, num: cfg.num,
    st: { skill: 40, conf: 50, energy: 80, fame: 5, chem: 30, money: 4000 },
    rel: { coach: 40, vane: -10, family: 70 },
    items: {}, flags: {}, camp: 0,
    slate: 0, role: 'camp', record: { w: 0, l: 0 },
    line: {}, grades: [], hist: [], used: [], queue: [], at: null, game: null, wk: null,
    runTrophies: [], recentMoments: [],
  };
  const b = ORIGINS[cfg.origin].bonus;
  for (const k in b) if (k in s.st) s.st[k] += b[k];
  const idx = shuffle(MOMENTS[cfg.pos].map((_, i) => i));
  s.flags.scrim = [idx[0], idx[1]];
  return s;
}
function save() { if (S) store.set(SAVE_KEY, S); }
function loadSave() { const s = store.get(SAVE_KEY, null); return s && s.v === 1 && s.at && P[s.at.id] ? s : null; }

// ---------- Text ----------
function tokens() {
  if (!S) return {};
  const o = ORIGINS[S.origin];
  return {
    first: S.first, last: S.last, LAST: S.last.toUpperCase(), fam: o.fam, fp: o.fp, fpos: o.fpos, fobj: o.fobj, where: o.where,
    pos: POS[S.pos].name.toLowerCase(), POS: S.pos, num: S.num, vnum: VANE_NUM[S.pos], poscoach: POSCOACH[S.pos],
    verb: POS[S.pos].verb, inj: INJ[S.pos], big: S.pos === 'LB' ? 'takeaway' : 'touchdown', king: S.pos === 'LB' ? 'quarterback' : 'linebacker',
  };
}
function fmt(text) {
  const t = tokens();
  let h = esc(text).replace(/\{(\w+)\}/g, (m, k) => (t[k] != null ? esc(t[k]) : m));
  return h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
}
function paraHTML(p) {
  if (p == null || p === '') return '';
  if (typeof p === 'string') return `<p>${fmt(p)}</p>`;
  if (p.s) return `<p class="say"><span class="who">${fmt(p.s)}</span>“${fmt(p.t)}”</p>`;
  if (p.note) return `<p class="note">${fmt(p.note)}</p>`;
  if (p.warn) return `<p class="warn">${fmt(p.warn)}</p>`;
  return '';
}
function textFor(m, r) {
  if (m[r]) return m[r];
  if (m.read) { const o = m.read.opts.find(x => x[1] === r); if (o) return o[2]; }
  return '';
}
const fmtMoment = textFor;

// ---------- Stats, toasts, trophies ----------
const LABELS = { skill: 'Skill', conf: 'Confidence', energy: 'Energy', fame: 'Fame', chem: 'Chemistry', coach: 'Coaches', vane: 'Vane', family: 'Family' };
function fx(d, quiet) {
  if (!d || !S) return;
  const parts = [];
  for (const k in d) {
    const v = Math.round(d[k]);
    if (!v) continue;
    if (k === 'money') {
      const before = S.st.money;
      S.st.money = Math.max(0, S.st.money + v);
      const real = S.st.money - before;
      if (!quiet && real) { parts.push([(real > 0 ? '+' : '−') + money(Math.abs(real)), real > 0 ? 'cash' : 'down']); if (real > 0) Sound.play('cash'); }
      continue;
    }
    let before, after;
    if (k in S.st) { before = S.st[k]; S.st[k] = clamp(before + v, 0, 100); after = S.st[k]; }
    else if (k === 'vane') { before = S.rel.vane; S.rel.vane = clamp(before + v, -100, 100); after = S.rel.vane; }
    else if (k in S.rel) { before = S.rel[k]; S.rel[k] = clamp(before + v, 0, 100); after = S.rel[k]; }
    else continue;
    const real = after - before;
    if (!quiet && real) parts.push([`${real > 0 ? '+' : '−'}${Math.abs(real)} ${LABELS[k]}`, real > 0 ? 'up' : 'down']);
  }
  if (parts.length) toast(parts);
  checkTrophies();
  renderCard();
}
// toast('text', cls) for one message, or toast([[text, cls], ...]) for a row of stat changes.
function toast(text, cls) {
  const box = $('#toasts');
  if (!box) return;
  const t = document.createElement('div');
  t.className = 'toast ' + (cls || '');
  if (Array.isArray(text)) t.innerHTML = text.map(([s, c]) => `<span class="tp ${c}">${esc(s)}</span>`).join('');
  else t.textContent = text;
  box.appendChild(t);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, cls === 'trophy' ? 3800 : 2300);
}
function trophyData() { const d = store.get(TROPHY_KEY, null) || {}; d.got = d.got || {}; d.pos = d.pos || []; return d; }
function award(id) {
  if (S && !S.runTrophies.includes(id)) S.runTrophies.push(id);
  const d = trophyData();
  if (d.got[id]) return;
  d.got[id] = Date.now();
  store.set(TROPHY_KEY, d);
  const t = TROPHIES.find(x => x[0] === id);
  if (t) { toast('Trophy unlocked: ' + t[1], 'trophy'); Sound.play('trophy'); }
}
function checkTrophies() {
  if (!S) return;
  if (S.st.fame >= 80) award('fame');
  if (S.st.chem >= 85) award('chem');
  if (S.rel.vane >= 60) award('torch');
  if (S.rel.family >= 95) award('family');
}

// ---------- Navigation ----------
const ACTIONS = {
  queue: () => nextInQueue(),
  advance: () => advanceGame(),
  finish: () => finishGame(),
  weekEnd: () => weekEnd(),
  beginWeek: () => beginWeek(),
};
function go(id, args, keepScroll) {
  S.at = { id, args: args || {} };
  save();
  screen = 'play';
  renderPlay(!keepScroll);
}
function goNext(n) {
  if (n == null) return;
  if (typeof n === 'string') return ACTIONS[n] ? ACTIONS[n]() : go(n);
  if (n.id) return go(n.id, n.args);
}
P._result = a => ({ kicker: a.kicker, title: a.title, body: a.body, next: a.next == null ? 'queue' : a.next });

function choose(c) {
  if (busy) return;
  busy = true;
  Sound.play('click');
  const out = c.do ? c.do() : null;
  const next = typeof c.then === 'function' ? c.then() : c.then;
  if (Array.isArray(out) && out.length) {
    return go('_result', { body: out, next: next == null ? 'queue' : next, kicker: curPage && curPage.kicker, title: c.rt || (curPage && curPage.title) });
  }
  if (next != null) return goNext(next);
  busy = false;
}

function renderPlay(scroll) {
  const main = $('#screen');
  if (!$('#sheet')) {
    main.innerHTML = `<div class="wrap"><div class="play"><section class="sheet" id="sheet"></section><aside class="card" id="card" aria-label="Player card"></aside></div></div>`;
  }
  renderCard();
  let page;
  try { page = P[S.at.id](S.at.args || {}); }
  catch (e) {
    console.error(e);
    page = { kicker: 'Timeout', title: 'Something Went Sideways', body: ['This page failed to load. Your career is still saved.'],
      choices: [{ label: 'Back to the title screen', do() { showTitle(); return null; } }] };
  }
  showPage(page);
  updateTopbar();
  if (scroll) {
    const top = $('#sheet').getBoundingClientRect().top + window.scrollY - 76;
    if (window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: reduceMotion ? 'auto' : 'smooth' });
  }
}
function showPage(pg) {
  stopMini();
  curPage = pg;
  busy = false;
  const el = $('#sheet');
  let h = '';
  if (pg.kicker) h += `<div class="kicker">${fmt(pg.kicker)}</div>`;
  if (pg.title) h += `<h2 class="title">${fmt(pg.title)}</h2>`;
  if (pg.board) h += boardHTML(pg.final);
  if (pg.html) h += pg.html;
  h += `<div class="story reveal">${(pg.body || []).map(paraHTML).join('')}</div>`;
  if (pg.after) h += pg.after;
  h += `<div id="mini"></div><div class="choices" id="choices"></div>`;
  el.innerHTML = h;
  if (pg.mini) startMini(pg.mini, $('#mini'));
  else renderChoices(pg);
  if (pg.custom) pg.custom(el);
}
function renderChoices(pg) {
  const box = $('#choices');
  if (!box) return;
  let list = (pg.choices || []).filter(c => !c.if || c.if());
  if (!list.length && pg.next != null) list = [{ label: pg.nextLabel || 'Continue', then: pg.next, primary: true }];
  box.innerHTML = '';
  list.forEach((c, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'choice' + (c.primary ? ' primary' : '');
    b.dataset.k = String(i + 1);
    b.innerHTML = `<span class="k">${i + 1}</span><span class="t">${fmt(c.label)}${c.sub ? `<small>${fmt(c.sub)}</small>` : ''}</span>`;
    b.addEventListener('click', () => choose(c));
    box.appendChild(b);
  });
}

// ---------- Player card ----------
function renderCard() {
  const el = $('#card');
  if (!el || !S) return;
  const open = el.classList.contains('open');
  const p = POS[S.pos], st = S.st, rel = S.rel;
  const roleName = { camp: 'Camp invite', practice: 'Practice squad', backup: 'Backup', rotation: 'Split snaps', starter: 'Starter' }[S.role] || '';
  const meter = (label, v, color) => `<div class="meter-row"><span class="ml">${label}</span><span class="bar"><i style="width:${v}%;background:${color}"></i></span><span class="mv">${v}</span></div>`;
  const vane = rel.vane, vw = Math.abs(vane) / 2, vl = vane >= 0 ? 50 : 50 - vw;
  const vaneRow = `<div class="meter-row" title="Marcus Vane: -100 to +100"><span class="ml">Vane</span><span class="bar center"><i style="left:${vl}%;width:${vw}%;background:${vane >= 0 ? 'var(--m-energy)' : 'var(--m-neg)'}"></i></span><span class="mv">${vane > 0 ? '+' : ''}${vane}</span></div>`;
  const items = Object.keys(S.items).filter(k => S.items[k] && ITEMS[k]).map(k => `<span class="pc-item" title="${esc(ITEMS[k][1])}">${esc(ITEMS[k][0])}</span>`);
  if (S.flags.agent) items.push(`<span class="pc-item" title="Your agent">Agent: ${S.flags.agent === 'sly' ? 'Sly' : 'Margaret'}</span>`);
  const stats = p.stats.map(([k, l]) => `<div><b>${S.line[k] || 0}</b><span>${l}</span></div>`).join('');
  el.innerHTML = `
    <div class="pc-head"><div class="pc-num">${esc(S.num)}</div><div style="min-width:0"><div class="pc-name">${esc(S.first)} ${esc(S.last)}</div><div class="pc-role">${S.pos} · ${roleName}</div></div></div>
    <button class="pc-toggle" type="button" aria-expanded="${open}"><span class="pc-mini"><span>Skill <b>${st.skill}</b></span><span>Conf <b>${st.conf}</b></span><span>Energy <b>${st.energy}</b></span><span><b>${money(st.money)}</b></span></span><span>${open ? 'Hide' : 'Show card'}</span></button>
    <div class="pc-body">
      <div class="pc-sec"><div class="pc-h">Attributes</div>
        ${meter('Skill', st.skill, 'var(--m-skill)')}${meter('Confidence', st.conf, 'var(--m-conf)')}${meter('Energy', st.energy, st.energy < 30 ? 'var(--m-neg)' : 'var(--m-energy)')}${meter('Fame', st.fame, 'var(--m-fame)')}${meter('Chemistry', st.chem, 'var(--m-chem)')}
      </div>
      <div class="pc-sec"><div class="pc-h">Relationships</div>
        ${meter('Coaches', rel.coach, 'var(--m-conf)')}${vaneRow}${meter(esc(ORIGINS[S.origin].fam), rel.family, 'var(--m-skill)')}
      </div>
      <div class="pc-money"><span>Bank</span><b>${money(st.money)}</b></div>
      ${items.length ? `<div class="pc-sec"><div class="pc-h">Items</div><div class="pc-items">${items.join('')}</div></div>` : ''}
      <div class="pc-sec"><div class="pc-h">Season stats · ${S.record.w}-${S.record.l}</div><div class="pc-stats">${stats}</div></div>

function updateTopbar() {
  const st = $('#status'), mb = $('#menuBtn');
  if (screen === 'play' && S) {
    let s;
    const id = S.at && S.at.id;
    if (id === 'ending') s = 'Season over';
    else if (id === 'draft' || id === 'call') s = 'Draft night';
    else if (S.role === 'camp') s = 'Training camp';
    else if (S.slate < 10) s = `Week ${S.slate + 1} of 10 · ${S.record.w}-${S.record.l}`;
    else s = `Playoffs · ${PLAYOFFS[Math.min(S.slate, 12) - 10].round}`;
    st.textContent = s;
    mb.hidden = false;
    document.body.classList.add('in-play');
  } else { st.textContent = ''; mb.hidden = true; document.body.classList.remove('in-play'); }
}

// ---------- Camp → season ----------
function campScore() { return S.camp + (S.st.skill - 40) / 4 + (S.rel.coach - 40) / 8; }
function campDone() {
  S.role = S.flags.made ? 'backup' : 'practice';
  if (!S.flags.made) S.flags.wasSquad = true;
  award('camp');
  const d = trophyData();
  if (!d.pos.includes(S.pos)) { d.pos.push(S.pos); store.set(TROPHY_KEY, d); }
  if (d.pos.length >= 4) award('all4');
  S.slate = 0;
  beginWeek();
}
function keepJob() {
  const gs = S.grades.filter(g => g.n >= 2 && g.n <= 5).map(g => g.v);
  const avg = gs.length ? gs.reduce((a, b) => a + b, 0) / gs.length : 1.5;
  return avg >= 2.0 || (avg >= 1.6 && S.rel.coach >= 60);
}

// ---------- The week ----------
const FIXED = { 0: 'w1_family', 1: () => (S.role === 'practice' ? 'w2_callup' : null), 3: 'w4_rehab', 4: 'w5_trash', 5: 'w6_agent', 6: 'w7_return', 7: 'w8_thanks', 8: 'w9_leo', 9: 'w10_stakes', 10: 'po1', 11: 'po2', 12: 'po3_media' };
function beginWeek() {
  const n = S.slate;
  S.wk = { picks: 2, done: [], log: [], film: false };
  S.flags.focus = false;
  S.game = null;
  const pay = S.role === 'practice' ? 13000 : n >= 10 ? 60000 : 48000;
  // Things drift if you don't tend to them: confidence settles, chemistry and fame fade, home feels farther away.
  fx({ energy: 12, conf: Math.round((55 - S.st.conf) * 0.2) + (S.items.blitz ? 2 : 0), chem: -2, fame: S.st.fame > 20 ? -2 : 0, family: -2 }, true);
  fx({ money: pay }, true);
  toast(`${n >= 10 ? 'Playoff' : 'Game'} check +${money(pay)}`, 'cash');
  const q = ['week_intro', 'week_hub'];
  let f = FIXED[n];
  if (typeof f === 'function') f = f();
  if (f) q.push(f);
  if (RANDOM_SLATES.includes(n)) { const e = drawEvent(); if (e) q.push({ id: 'event', args: { e } }); }
  q.push('game_pre');
  S.queue = q;
  nextInQueue();
}
function nextInQueue() {
  const n = S.queue.shift();
  if (!n) return go('game_pre');
  if (typeof n === 'string') go(n); else go(n.id, n.args);
}
function drawEvent() {
  const pool = Object.keys(EVENTS).filter(k => !S.used.includes(k) && (!EVENTS[k].if || EVENTS[k].if()));
  if (!pool.length) return null;
  const k = pick(pool);
  S.used.push(k);
  return k;
}
function weekKicker() { const n = S.slate; return n < 10 ? `Week ${n + 1} of 10` : `Playoffs · ${PLAYOFFS[n - 10].round}`; }
function roleLine() {
  return {
    practice: `You're on the practice squad. You'll practice all week, but you won't dress on Sunday.`,
    backup: `You're the backup {pos} behind Marcus Vane. Stay ready. Coach may call your number for a few plays.`,
    rotation: `You and Vane are splitting snaps. Make the most of yours.`,
    starter: `You're the starting {pos}. The ${S.pos === 'LB' ? 'defense' : 'offense'} runs through you.`,
  }[S.role] || '';
}
function matchupHTML(opp) {
  const threat = clamp(Math.round((opp.r - 40) / 8), 1, 5);
  const ti = Array.from({ length: 5 }, (_, i) => `<i class="${i < threat ? 'on' : ''}"></i>`).join('');
  return `<div class="matchup"><div class="mu-side"><div class="mu-team">Hammerheads</div><div class="mu-sub">${S.slate < 10 ? `Record ${S.record.w}-${S.record.l}` : 'Harbor City'}</div></div><div class="mu-vs">vs</div><div class="mu-side right"><div class="mu-team">${esc(opp.team)}</div><div class="mu-sub">Threat <span class="threat" role="img" aria-label="Threat ${threat} of 5">${ti}</span></div></div></div>`;
}

P.week_intro = () => {
  const n = S.slate, opp = oppOf(n);
  const body = [opp.blurb];
  const last = S.hist[S.hist.length - 1];
  if (last) body.push(`Last week: ${last.won ? 'beat' : 'lost to'} the ${last.opp}, ${Math.max(last.us, last.them)}-${Math.min(last.us, last.them)}.`);
  body.push(roleLine());
  if (S.st.energy < 30) body.push({ warn: `You're running on fumes (Energy ${S.st.energy}). Your timing will be off on Sunday. A recovery day would help.` });
  return { kicker: weekKicker(), title: opp.team, html: matchupHTML(opp), body, next: 'queue', nextLabel: 'Plan your week' };
};

P.week_hub = () => ({
  kicker: weekKicker(),
  title: 'Plan Your Week',
  body: [`You have time for **two** things before game day. Energy carries into Sunday, so choose with care.`],
  custom: renderHub,
});
function renderHub(el) {
  const wk = S.wk, left = wk.picks - wk.done.length;
  const wrap = document.createElement('div');
  let h = `<div class="picks-left">${left > 0 ? `${left} pick${left > 1 ? 's' : ''} left` : 'Week planned'}</div><div class="acts">`;
  let k = 0;
  ACTS.forEach(a => {
    const ok = !a.req || a.req();
    const picked = wk.done.includes(a.id);
    const dis = picked || !ok || left <= 0;
    const key = dis ? 0 : ++k;
    h += `<button type="button" class="act${picked ? ' picked' : ''}" data-act="${a.id}"${key ? ` data-k="${key}"` : ''}${dis ? ' disabled' : ''}>
      <span class="act-top"><span class="act-name">${fmt(a.name)}</span>${key ? `<kbd>${key}</kbd>` : picked ? '<span class="fxc up">Done</span>' : ''}</span>
      <span class="act-desc">${fmt(a.desc())}</span>
      <span class="act-fx">${ok ? a.chips.map(c => `<span class="fxc ${c[1]}">${c[0]}</span>`).join('') : `<span class="fxc lock">${esc(a.lock)}</span>`}</span>
    </button>`;
  });
  h += '</div>';
  if (wk.log.length) h += `<div class="hub-log">${wk.log.map(l => `<p><b>${fmt(l[0])}.</b> ${fmt(l[1])}</p>`).join('')}</div>`;
  wrap.innerHTML = h;
  el.querySelector('.story').after(wrap);
  $$('.act', wrap).forEach(b => b.addEventListener('click', () => {

// ---------- Game day ----------
const TEAM_TD = ['A twelve-play drive ends with a Hammerheads touchdown.', 'Tiny flattens a defensive end, and the Hammerheads punch it in from the 2.', 'Trick play! The Hammerheads score on a flea-flicker.', 'A 71-yard punt return sets up a quick Hammerheads touchdown.'];

const OPP_TD = ['The {opp} hit a deep pass for a touchdown.', 'The {opp} grind out a long drive and score.', 'A fumble gives the {opp} a short field, and they cash in.'];
const OPP_FG = ['The {opp} kick a field goal.', 'The Hammerheads defense holds in the red zone. The {opp} settle for three.'];
const WIN_LINES = ['The locker room is loud enough to rattle the lockers. Tiny is standing on a bench, shirtless, for reasons nobody can explain.', 'Bramble hands out game balls. He says nine words in total. It\'s the longest speech he\'s given all year.', 'Somebody turns the music up so loud the equipment guy has to unplug it.'];

P.game_pre = () => {

  ];
  const body = [flavor[n % flavor.length]];

  if (n >= 10) body.push(`Playoff football. Every snap feels twice as loud.`);
  body.push({ practice: `You're on the practice squad, so you watch from the sideline in a team hoodie. Next week, maybe.`, backup: `You're the backup. Helmet on, stay loose. Your number might get called.`, rotation: `You and Vane will trade series today.`, starter: `You're starting. Here we go.` }[S.role]);

function clockStr(late) { const m = late ? ri(1, 2) : ri(1, 14); return `${m}:${String(ri(0, 59)).padStart(2, '0')}`; }
function teamRating() {
  let r = 50 + (S.st.chem - 30) * 0.15;
  if (S.role === 'starter') r += (S.st.skill - 50) * 0.25;
  else if (S.role === 'rotation') r += (S.st.skill - 50) * 0.12;
  return r;
}
function drive(off, def, mult) {
  const edge = (off - def) / 100;
  const pTD = clamp(0.26 + edge * 0.7, 0.08, 0.5) * mult;
  const pFG = 0.2 * mult;
  const x = Math.random();
  return x < pTD ? 7 : x < pTD + pFG ? 3 : 0;
}
function gameDiff() { const g = S.game, opp = oppOf(g.n); return clamp(1 + (opp.r - 45) / 9 + (g.n >= 10 ? 0.3 : 0), 0.8, 5); }
function hasEdge() { return !!((S.wk && S.wk.film) || S.items.notes || S.flags.focus); }
function miniCfg(m, diff) { return { type: m.type, diff, prompt: m.prompt, btn: m.btn, read: m.read, fakes: m.fakes, edge: hasEdge() }; }

function startGame() {
  const n = S.slate;
  let qs = { starter: [1, 2, 3], rotation: [2, 3], backup: [3], practice: [] }[S.role] || [];
  let special = null;
  if (n === 2 && !S.flags.vaneHurt) { special = 'injury'; qs = [2, 3]; }
  const lib = MOMENTS[S.pos], recent = S.recentMoments || [];
  const order = shuffle(lib.map((_, i) => i)).sort((a, b) => (recent.includes(a) ? 1 : 0) - (recent.includes(b) ? 1 : 0));
  const plan = qs.map((q, i) => ({ q, m: order[i], clock: clockStr() }));
  S.recentMoments = plan.map(p => p.m);
  S.game = { n, us: 0, them: 0, q: 0, plan, mi: 0, res: [], recap: [], seen: 0, special, line: {}, bgTD: 0, done: false, clock: clockStr(true) };
  if (S.role !== 'practice' && S.st.energy < 15) award('empty');
  Sound.play('whistle');
  advanceGame();
}
function simQuarter(q) {
  const g = S.game, opp = oppOf(g.n);
  const us = teamRating(), them = opp.r + (g.n === 4 && S.flags.trash === 'fire' ? 3 : 0);
  const mult = q === 4 ? 0.85 : 1;
  const a = drive(us, them, mult), b = drive(them, us, mult);
  const nick = shortName(opp.team);
  if (a) { g.us += a; if (a === 7) g.bgTD++; g.recap.push(`Q${q}: ${pick(a === 7 ? TEAM_TD : TEAM_FG)}`); }
  if (b) { g.them += b; g.recap.push(`Q${q}: ${pick(b === 7 ? OPP_TD : OPP_FG).replace('{opp}', nick)}`); }
}
function advanceGame() {
  const g = S.game;
  while (g.q < 4) {

    if (g.special === 'injury' && g.q === 2 && !g.injured) { g.injured = true; return go('g_injury'); }
    if (g.plan[g.mi] && g.plan[g.mi].q === g.q) return go('g_moment');
  }

}
function endRegulation() {
  const g = S.game, d = g.us - g.them;

  if (d === 0) {
    if (chance(0.5 + (teamRating() - oppOf(g.n).r) / 100)) g.us += 3; else g.them += 3;

}
function recapLines() { const g = S.game; return g.recap.slice(g.seen).map(t => ({ note: t })); }
function boardHTML(final) {
  const g = S.game;
  if (!g) return '';
  const opp = oppOf(g.n);
  return `<div class="board" role="group" aria-label="Scoreboard: Hammerheads ${g.us}, ${esc(opp.team)} ${g.them}"><div class="bteam"><span class="bname">Hammerheads</span><span class="bscore">${g.us}</span></div><div class="bmid">${final ? 'Final' : 'Q' + Math.max(1, g.q)}</div><div class="bteam right"><span class="bscore">${g.them}</span><span class="bname">${esc(shortName(opp.team))}</span></div></div>`;
}

P.g_moment = () => {

  const body = recapLines();

    title: m.title,
    board: true,

  };

function momentDone(r, x) {
  const g = S.game, m = MOMENTS[S.pos][g.plan[g.mi].m];
  const body = [];
  let text = x && x.text ? x.text : textFor(m, r);
  if (r === 'bad' && S.items.luck) {
    delete S.items.luck;
    r = 'good';
    text = textFor(m, 'good');
    body.push({ note: `The rabbit's foot in your sock goes warm. The play turns around.` });
  }
  body.push(text);
  const res = playResult(r, m);
  body.push({ note: res.note });
  g.res.push(r);
  g.mi++;

P.g_mres = a => ({
  kicker: `Q${S.game.q} · vs ${oppOf(S.game.n).team}`,
  title: { great: 'Big Play!', good: 'Nice Work', bad: 'Rough One' }[a.r],
  board: true,
  body: a.body,
  next: 'advance',
});
function playResult(r, m) {
  const g = S.game;
  let note = '', td = false;
  if (S.pos !== 'LB') {
    if (r === 'great') {
      if (chance(0.75)) { g.us += 7; td = true; note = '**Touchdown, Hammerheads!**'; }
      else { g.us += 3; note = 'The drive stalls in the red zone. Field goal is good.'; }
    } else if (r === 'good') {
      if (chance(0.45)) { g.us += 3; note = 'The drive ends with a field goal.'; }
      else note = 'Good field position, but the drive ends in a punt.';
    } else {
      const x = Math.random();
      if (x < 0.3) { g.them += 7; note = 'They turn it into a touchdown the other way.'; }
      else if (x < 0.6) { g.them += 3; note = 'They turn it into a field goal.'; }
      else note = 'Your defense bails you out with a stop.';
    }
  } else {
    if (r === 'great') {
      const x = Math.random();
      if (m.tag === 'take' && x < 0.25) { g.us += 7; td = true; note = '**Defensive touchdown!** You take it all the way back.'; }
      else if (x < 0.65) { g.us += 3; note = 'The offense turns the short field into a field goal.'; }
      else note = 'Three and out. The crowd is on its feet.';
    } else if (r === 'good') note = 'Drive stalled. They have to punt.';
    else if (chance(0.6)) { g.them += 7; note = 'They punch it in for a touchdown.'; }
    else { g.them += 3; note = 'They settle for a field goal.'; }
  }
  statsFor(r, td, m);
  const f = { great: { conf: 2, fame: 1, coach: 2 }, good: { conf: 1 }, bad: { conf: -3, coach: -2 } }[r];
  if (td) f.fame += 2;

  if (r === 'great') award('bigplay');
  if (td) award('six');
  return { note, td };
}
function addLine(L) {
  const g = S.game;
  for (const k in L) {
    if (k === 'long') { S.line.long = Math.max(S.line.long || 0, L.long); g.line.long = Math.max(g.line.long || 0, L.long); continue; }
    S.line[k] = (S.line[k] || 0) + L[k];
    g.line[k] = (g.line[k] || 0) + L[k];
  }
}
function statsFor(r, td, m, clutch) {
  const L = {};
  switch (S.pos) {
    case 'QB':
      L.passYds = r === 'great' ? ri(28, 58) : r === 'good' ? ri(7, 19) : 0;
      if (r === 'bad' && m.type === 'read' && !clutch && chance(0.5)) L.int = 1;
      break;
    case 'RB': { const y = r === 'great' ? ri(18, 64) : r === 'good' ? ri(4, 12) : ri(-3, 1); L.rushYds = y; L.long = y; break; }
    case 'WR':
      if (r !== 'bad') { L.rec = 1; L.recYds = r === 'great' ? ri(24, 61) : ri(7, 18); }
      break;
    case 'LB':
      if (r !== 'bad') L.tkl = ri(1, 2);
      if (r === 'great' && m.tag === 'take') L.take = 1;
      if (r === 'great' && m.tag === 'sack') L.sacks = 1;
      break;
  }
  if (td) L.td = 1;
  addLine(L);

P.g_clutch = () => {
  const g = S.game, opp = oppOf(g.n), d = g.us - g.them, chase = d <= 0;
  const c = CLUTCH[S.pos][chase ? 'chase' : 'hold'];
  const sit = d < 0 ? `Down ${-d}` : d > 0 ? `Up ${d}` : `Tied ${g.us}-${g.them}`;
  const body = recapLines();
  body.push(`**${sit}, ${g.clock} left in the fourth quarter.** ${chase ? needLine(-d) : (S.pos === 'LB' ? 'Hold them, and it\'s over.' : 'Close it out.')}`);
  if (S.role === 'backup' || S.role === 'rotation') body.push({ s: S.role === 'backup' ? 'Coach Okafor' : 'Coach Bramble', t: `{last}. You're in. Win us the game.` });
  body.push(c.setup);
  return {
    kicker: `Q4 · ${g.clock} · vs ${opp.team}`,
    title: c.title,
    board: true,
    body,
    mini: Object.assign(miniCfg(c, gameDiff() + 1), { clutch: true, onDone: clutchDone }),
  };
};
function needLine(def) {
  if (S.pos === 'LB') return def === 0 ? 'Get the ball back and the offense can win it.' : `They're trying to run out the clock. Get the ball back.`;
  return def === 0 ? 'Any score wins it.' : def <= 2 ? 'A field goal wins it.' : def <= 6 ? 'You need a touchdown.' : def === 7 ? 'You need a touchdown and a two-point conversion.' : 'You need a touchdown and a two-point conversion just to force overtime.';
}
const CLUTCH_NOTES = {
  hold: '**Ballgame.** The offense lines up in victory formation.',
  fg: 'Your kicker drills a 41-yarder as time expires. **Hammerheads win!**',
  td: '**Touchdown!** The defense holds on the final snap. **Hammerheads win!**',
  td2: '**Touchdown,** and the two-point try is good! **Hammerheads win by one!**',
  ot: 'Touchdown and two points to tie it. **Overtime.** The Hammerheads win the coin toss, march down the field, and kick the winner.',
  short: 'That was the last chance. They kneel it out. **Final.**',
  lost: 'They score in the final seconds. The stadium goes silent. **Final.**',
  otl: 'They tie it with seconds left, then win it in overtime. **Final.**',
};
function clutchResolve(success) {
  const g = S.game, d = g.us - g.them;

    if (d > 0) return 'hold';
    const need = -d, add = need <= 2 ? 3 : need <= 6 ? 7 : 8;

  }

function clutchDone(r, x) {
  const g = S.game, chase = g.us - g.them <= 0, c = CLUTCH[S.pos][chase ? 'chase' : 'hold'];
  const body = [];
  let text = x && x.text ? x.text : textFor(c, r);
  if (r === 'bad' && S.items.luck) {
    delete S.items.luck;
    r = 'good';
    text = textFor(c, 'good');
    body.push({ note: `The rabbit's foot in your sock goes warm. The play turns around.` });
  }
  body.push(text);
  const success = r !== 'bad';
  const note = clutchResolve(success);
  g.res.push(r);
  const td = success && S.pos !== 'LB' && (note === 'td' || note === 'td2' || note === 'ot');
  statsFor(r, td, c, true);
  if (S.pos === 'LB' && chase && success) body.push({ note: 'The offense takes over on a short field.' });
  body.push({ note: CLUTCH_NOTES[note] });
  if (success) {
    fx({ conf: 4, fame: r === 'great' ? 4 : 3, coach: 3 });
    award('clutch');
    if (r === 'great') award('bigplay');

P.g_cres = a => ({
  kicker: `Q4 · 0:00 · vs ${oppOf(S.game.n).team}`,
  title: a.success ? 'Clutch!' : 'So Close',
  board: true,
  final: true,
  body: a.body,
  next: 'finish',
  nextLabel: 'Final whistle',
});

function binom(n, p) { let k = 0; for (let i = 0; i < n; i++) if (Math.random() < p) k++; return k; }
function letter(v) { return v >= 2.75 ? 'A+' : v >= 2.5 ? 'A' : v >= 2.25 ? 'A−' : v >= 2 ? 'B+' : v >= 1.75 ? 'B' : v >= 1.5 ? 'B−' : v >= 1.25 ? 'C' : v >= 1 ? 'D' : 'F'; }
function lineText(L) {
  switch (S.pos) {
    case 'QB': return `${L.passYds || 0} passing yards, ${L.td || 0} TD, ${L.int || 0} INT`;
    case 'RB': return `${L.rushYds || 0} rushing yards, ${L.td || 0} TD, long of ${L.long || 0}`;
    case 'WR': return `${L.rec || 0} catches, ${L.recYds || 0} yards, ${L.td || 0} TD`;
    default: return `${L.tkl || 0} tackles, ${L.sacks || 0} sacks, ${L.take || 0} takeaways`;
  }
}
function finishGame() {
  const g = S.game;
  if (g.done) return go('g_final');
  g.done = true;
  // The plays you weren't the star of still add to your stat line.
  const mult = { starter: 1, rotation: 0.5, backup: 0.12, practice: 0 }[S.role] || 0;
  if (mult) {
    const L = {};
    if (S.pos === 'QB') { L.passYds = Math.round(ri(120, 200) * mult); L.td = binom(g.bgTD, 0.6 * mult); }
    if (S.pos === 'RB') { L.rushYds = Math.round(ri(30, 65) * mult); L.td = binom(g.bgTD, 0.35 * mult); }
    if (S.pos === 'WR') { L.rec = Math.round(ri(2, 4) * mult); L.recYds = Math.round(ri(20, 45) * mult); L.td = binom(g.bgTD, 0.3 * mult); }
    if (S.pos === 'LB') { L.tkl = Math.round(ri(3, 6) * mult); }
    addLine(L);
  }
  const won = g.us > g.them;
  g.won = won;
  if (g.n < 10) { if (won) S.record.w++; else S.record.l++; }
  else if (!won) S.flags.lostRound = g.n;
  else if (g.n === 12) S.flags.champion = true;
  if (g.res.length) {
    const v = g.res.reduce((a, r) => a + { great: 3, good: 2, bad: 0.5 }[r], 0) / g.res.length;
    g.grade = v;
    S.grades.push({ n: g.n, v });
    if (v >= 2.75 && g.res.length >= 2) award('perfect');

  if (g.n === 8 && S.flags.leoPromise) {
    const kept = S.pos === 'LB' ? !!(g.line.take || g.line.sacks || g.line.td) : !!g.line.td;
    S.flags.leoKept = kept;
    if (kept) award('leo');
  }
  if (g.n === 9 && S.record.w === 10) award('undefeated');
  if (g.n >= 10 && won && S.flags.wasSquad) award('squad');
  if (g.n === 12 && won) award('champ');
  S.hist.push({ n: g.n, opp: shortName(oppOf(g.n).team), us: g.us, them: g.them, won });
  const cost = { starter: 16, rotation: 11, backup: 7, practice: 2 }[S.role] || 5;
  g.press = g.n !== 12 && S.role !== 'practice' && (g.n >= 10 || chance(0.45));
  fx({ energy: -cost, conf: won ? 2 : -3, chem: won ? 2 : -1, coach: g.grade != null ? Math.round((g.grade - 1.75) * 4) : 0, fame: S.flags.leoKept && g.n === 8 ? 5 : 0 });
  go('g_final');
}
P.g_final = () => {

const TAGS = { timing: 'Timing', reaction: 'Reaction', combo: 'Moves', read: 'The read' };
const DEFAULT_PROMPT = { timing: 'Stop the needle in the window. Orange is perfect.', reaction: 'Move on the orange GO, not before.', combo: 'Hit the moves in order before time runs out.', read: 'Make the call before the play clock runs out.' };
function stopMini() { if (mini) { mini.stop(); mini = null; } }
function startMini(cfg, host) {
  const f = { timing: miniTiming, reaction: miniReaction, combo: miniCombo, read: miniRead }[cfg.type];

}
function mgHead(cfg) {

}
function endMini(host, r, label, cb, extra) {
  Sound.play(r === 'great' ? 'great' : r === 'good' ? 'good' : 'bad');
  const mg = host.querySelector('.mg');
  if (mg) {

}

// Timing: stop a sweeping needle inside the window.
function miniTiming(cfg, host) {
  const s = S.st, d = cfg.diff;
  const band = cfg.clutch && S.items.band ? 5 : 0;
  const goodW = clamp(13 + s.skill * 0.17 + (s.conf - 50) * 0.06 - d * 1.8 + band, 7, 36);
  const perfW = goodW * 0.36;
  const speed = 50 + d * 13 + (s.energy < 30 ? 16 : 0);
  const c = rand(goodW / 2 + 6, 100 - goodW / 2 - 6);
  host.innerHTML = `<div class="mg">${mgHead(cfg)}
    <div class="meter" role="presentation"><div class="zone good" style="left:${c - goodW / 2}%;width:${goodW}%"></div><div class="zone perfect" style="left:${c - perfW / 2}%;width:${perfW}%"></div><div class="needle" style="left:0%"></div></div>
    <div class="mg-row"><span class="mg-help">Press <kbd>Space</kbd> or tap the button once to start and again to stop.</span><button class="mg-btn" type="button">Snap it</button></div></div>`;
  const needle = host.querySelector('.needle'), btn = host.querySelector('.mg-btn');
  let running = false, pos = 0, dir = 1, last = 0, passes = 0, raf = 0, done = false;
  function frame(t) {
    if (!last) last = t;
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    pos += dir * speed * dt;
    if (pos >= 100) { pos = 100; dir = -1; passes++; }
    else if (pos <= 0) { pos = 0; dir = 1; passes++; }
    needle.style.left = pos + '%';
    if (passes >= 4) return stopAt(true);
    raf = requestAnimationFrame(frame);
  }
  function stopAt(timeout) {
    if (done) return;
    done = true;
    cancelAnimationFrame(raf);
    const dist = Math.abs(pos - c);
    const r = timeout ? 'bad' : dist <= perfW / 2 ? 'great' : dist <= goodW / 2 ? 'good' : 'bad';
    endMini(host, r, timeout ? 'Too late' : null, cfg.onDone);
  }
  function act() {
    if (done) return;
    if (!running) { running = true; btn.textContent = cfg.btn || 'Now!'; Sound.play('tick'); raf = requestAnimationFrame(frame); }
    else stopAt(false);
  }
  btn.addEventListener('click', act);
  host.querySelector('.meter').addEventListener('pointerdown', e => { e.preventDefault(); act(); });
  mini = {
    stop() { done = true; cancelAnimationFrame(raf); },
    key(e) { if (e.key === ' ' || e.key === 'Enter') { if (!e.repeat) act(); return true; } return false; },
    finish(r) { if (done) return; done = true; cancelAnimationFrame(raf); endMini(host, r, null, cfg.onDone); },
  };
}

// Reaction: go on the real signal, ignore the fake ones.
function miniReaction(cfg, host) {
  const s = S.st, d = cfg.diff;
  const great = 300 + s.skill * 1.3 - d * 12 - (s.energy < 30 ? 40 : 0);
  const good = great + 230;
  const nFakes = cfg.fakes != null ? cfg.fakes : ri(0, 2);
  host.innerHTML = `<div class="mg">${mgHead(cfg)}
    <button class="react-pad" type="button"><span class="rp-text">Tap to get set</span></button>
    <div class="mg-row"><span class="mg-help">Tap the pad or press <kbd>Space</kbd>. Jumping on a fake call is a penalty.</span></div></div>`;
  const pad = host.querySelector('.react-pad'), txt = pad.querySelector('.rp-text');
  const fakes = ['Hut!', 'Blue 80!', 'Omaha!', 'Hut-hut!'];
  let phase = 'idle', t0 = 0, done = false;
  const timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  function arm() {
    phase = 'wait';
    pad.className = 'react-pad wait';
    txt.textContent = 'Set…';
    let t = rand(900, 1700);
    for (let i = 0; i < nFakes; i++) {
      later(() => { if (phase !== 'wait') return; txt.textContent = pick(fakes); pad.classList.add('fake'); later(() => { pad.classList.remove('fake'); if (phase === 'wait') txt.textContent = 'Set…'; }, 420); }, t);
      t += rand(800, 1400);
    }
    later(() => {
      if (phase !== 'wait') return;
      phase = 'go';
      t0 = performance.now();
      pad.className = 'react-pad go';
      txt.textContent = 'GO';
      Sound.play('tick');
      later(() => { if (phase === 'go') finish('bad', 'Too slow'); }, good + 500);
    }, t);
  }
  function press() {
    if (done) return;
    if (phase === 'idle') return arm();
    if (phase === 'wait') return finish('bad', 'False start');
    if (phase === 'go') { const rt = performance.now() - t0; finish(rt <= great ? 'great' : rt <= good ? 'good' : 'bad', `${Math.round(rt)} ms`); }
  }
  function finish(r, label) {
    if (done) return;
    done = true;
    phase = 'done';
    timers.forEach(clearTimeout);
    endMini(host, r, label, cfg.onDone);
  }
  pad.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  pad.addEventListener('click', e => { if (e.detail === 0) press(); }); // keyboard activation only
  mini = {
    stop() { done = true; timers.forEach(clearTimeout); },
    key(e) { if (e.key === ' ' || e.key === 'Enter') { if (!e.repeat) press(); return true; } return false; },
    finish(r) { finish(r); },
  };
}

// Combo: enter the arrow sequence before the clock runs out.
function miniCombo(cfg, host) {
  const s = S.st, d = cfg.diff;
  const len = clamp(3 + Math.round(d / 2), 3, 6);
  const band = cfg.clutch && S.items.band ? 0.4 : 0;
  const total = clamp(2.5 + s.skill * 0.018 + (s.conf - 50) * 0.006 - d * 0.18 - (s.energy < 30 ? 0.3 : 0) + band, 1.8, 4.6);
  const keys = ['ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown'];
  const glyph = { ArrowLeft: '←', ArrowUp: '↑', ArrowRight: '→', ArrowDown: '↓' };
  const alias = { a: 'ArrowLeft', w: 'ArrowUp', d: 'ArrowRight', s: 'ArrowDown', A: 'ArrowLeft', W: 'ArrowUp', D: 'ArrowRight', S: 'ArrowDown' };
  const seq = Array.from({ length: len }, () => pick(keys));
  host.innerHTML = `<div class="mg">${mgHead(cfg)}
    <div class="combo-seq">${seq.map((k, i) => `<span class="arrow-box${i === 0 ? ' cur' : ''}">${glyph[k]}</span>`).join('')}</div>
    <div class="timer"><i></i></div>
    <div class="combo-pad">${keys.map(k => `<button class="pad-btn" type="button" data-key="${k}" aria-label="${k.replace('Arrow', '')}">${glyph[k]}</button>`).join('')}</div>
    <div class="mg-row"><span class="mg-help">Arrow keys, WASD, or the pad. The clock starts on your first move. A wrong move costs time.</span></div></div>`;
  const boxes = $$('.arrow-box', host), bar = host.querySelector('.timer > i'), seqEl = host.querySelector('.combo-seq');
  let started = false, idx = 0, left = total, last = 0, raf = 0, done = false;
  function frame(t) {
    if (!last) last = t;
    left -= Math.min(0.05, (t - last) / 1000);
    last = t;
    bar.style.transform = `scaleX(${Math.max(0, left / total)})`;
    if (left <= 0) return finish('bad', 'Brought down');
    raf = requestAnimationFrame(frame);
  }
  function input(k) {
    if (done) return;
    if (!started) { started = true; raf = requestAnimationFrame(frame); }
    if (k === seq[idx]) {
      boxes[idx].classList.remove('cur');
      boxes[idx].classList.add('done');
      idx++;
      Sound.play('tick');
      if (idx === len) return finish(left / total >= 0.4 ? 'great' : 'good');
      boxes[idx].classList.add('cur');
    } else {
      left -= 0.5;
      seqEl.classList.remove('shake');
      void seqEl.offsetWidth;
      seqEl.classList.add('shake');
    }
  }
  function finish(r, label) {
    if (done) return;
    done = true;
    cancelAnimationFrame(raf);
    endMini(host, r, label, cfg.onDone);
  }
  $$('.pad-btn', host).forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); input(b.dataset.key); }));
  $$('.pad-btn', host).forEach(b => b.addEventListener('click', e => { if (e.detail === 0) input(b.dataset.key); }));
  mini = {
    stop() { done = true; cancelAnimationFrame(raf); },
    key(e) { const k = keys.includes(e.key) ? e.key : alias[e.key]; if (k) { if (!e.repeat) input(k); return true; } return e.key === ' '; },
    finish(r) { finish(r); },
  };
}

// Read: pick the right call before the play clock runs out.
function miniRead(cfg, host) {
  const rd = cfg.read, d = cfg.diff;
  const total = clamp(11 - d * 0.7, 6, 11);
  const opts = shuffle(rd.opts);
  host.innerHTML = `<div class="mg">${mgHead(cfg)}

  const zone = host.querySelector('.read-zone');
  let started = false, left = total, last = 0, raf = 0, done = false, bar = null;
  function start() {
    if (started || done) return;
    started = true;
    zone.innerHTML = `<div class="timer"><i></i></div><div class="read-opts">${opts.map((o, i) => `<button class="read-opt" type="button" data-i="${i}"><span class="k">${i + 1}</span><span>${fmt(o[0])}</span></button>`).join('')}</div>`;
    bar = zone.querySelector('.timer > i');
    $$('.read-opt', zone).forEach(b => b.addEventListener('click', () => choosePick(+b.dataset.i)));
    raf = requestAnimationFrame(frame);
  }
  function frame(t) {
    if (!last) last = t;
    left -= Math.min(0.05, (t - last) / 1000);
    last = t;
    bar.style.transform = `scaleX(${Math.max(0, left / total)})`;
    if (left <= 0) {
      done = true;
      endMini(host, 'bad', 'Delay of game', cfg.onDone, { text: 'The play clock hits zero before you can decide. Flag. Delay of game.' });
      return;
    }
    raf = requestAnimationFrame(frame);
  }
  function choosePick(i) {
    if (done || !started) return;
    done = true;
    cancelAnimationFrame(raf);
    const o = opts[i];
    endMini(host, o[1], null, cfg.onDone, { text: o[2] });
  }
  host.querySelector('.mg-btn').addEventListener('click', start);
  mini = {
    stop() { done = true; cancelAnimationFrame(raf); },
    key(e) {
      if (!started) { if (e.key === ' ' || e.key === 'Enter') { start(); return true; } return false; }
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= opts.length) { choosePick(n - 1); return true; }
      return false;
    },
    finish(r) {
      if (done) return;
      done = true;
      cancelAnimationFrame(raf);
      const o = opts.find(x => x[1] === r);
      endMini(host, r, null, cfg.onDone, { text: o ? o[2] : '' });
    },
  };
}

  form.addEventListener('submit', e => {
    e.preventDefault();
    const clean = v => v.replace(/\s+/g, ' ').trim();
    const first = clean($('#fFirst').value), last = clean($('#fLast').value);
    if (!first || !last) { $('#fErr').hidden = false; return; }
    Sound.play('whistle');
    S = newState({
      first, last,
      pos: form.querySelector('input[name=pos]:checked').value,
      origin: form.querySelector('input[name=origin]:checked').value,
      num: +form.querySelector('input[name=num]:checked').value,
    });
    go('draft');
  });
}
function renderTrophies() {
  const d = trophyData(), got = d.got;
  $('#screen').innerHTML = `<div class="wrap"><div class="sheet">
    <div class="kicker">Trophy case</div>
    <h2 class="title">${Object.keys(got).length} of ${TROPHIES.length} Unlocked</h2>
    <p style="margin:0 0 16px">Positions that made it through camp: ${['QB', 'RB', 'WR', 'LB'].map(p => `<span class="chip" style="opacity:${d.pos.includes(p) ? 1 : 0.45}">${p}${d.pos.includes(p) ? ' ✓' : ''}</span>`).join(' ')}</p>
    <div class="trophies">${TROPHIES.map(([id, n, desc]) => `<div class="trophy${got[id] ? ' on' : ''}"><span class="ti" aria-hidden="true">${got[id] ? '★' : '?'}</span><div style="min-width:0"><b>${esc(n)}</b><span>${esc(desc)}</span></div></div>`).join('')}</div>
    <div class="choices"><button class="choice primary" id="trBack" type="button" data-k="1"><span class="k">1</span><span class="t">Back</span></button></div>
  </div></div>`;
  $('#trBack').addEventListener('click', () => { Sound.play('click'); if (trophyBack === 'play' && S && S.at) { screen = 'play'; render(); } else showTitle(); });
}
function showTitle() { stopMini(); screen = 'title'; render(); }
function showTrophies(from) { stopMini(); trophyBack = from || 'title'; screen = 'trophies'; render(); }
function newCareer() { stopMini(); S = null; store.del(SAVE_KEY); screen = 'setup'; render(); window.scrollTo(0, 0); }

function openMenu() {
  if ($('#menu') || screen !== 'play') return;
  if (mini) { stopMini(); menuKilledMini = true; }
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.id = 'menu';
  ov.innerHTML = `<div class="sheet menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <div class="kicker">Timeout</div><h2 class="title" id="menuTitle">Menu</h2>
    <button class="btn btn-primary" type="button" data-m="resume">Resume</button>
    <button class="btn btn-plain" type="button" data-m="trophies">Trophy case</button>
    <button class="btn btn-plain" type="button" data-m="title">Title screen</button>
    <button class="btn btn-plain" type="button" data-m="restart">Start a new career</button>
    <p class="confirm-text" hidden>This erases your current career. Tap again to confirm.</p></div>`;
  document.body.appendChild(ov);
  let armed = false;
  ov.addEventListener('click', e => {
    if (e.target === ov) return closeMenu();
    const b = e.target.closest('[data-m]');
    if (!b) return;
    Sound.play('click');
    const m = b.dataset.m;
    if (m === 'resume') closeMenu();
    if (m === 'trophies') { closeMenu(true); showTrophies('play'); }
    if (m === 'title') { closeMenu(true); showTitle(); }
    if (m === 'restart') {
      if (!armed) { armed = true; ov.querySelector('.confirm-text').hidden = false; return; }
      closeMenu(true); newCareer();
    }
  });
  ov.querySelector('[data-m=resume]').focus();
}
function closeMenu(silent) {
  const ov = $('#menu');
  if (ov) ov.remove();
  if (menuKilledMini) { menuKilledMini = false; if (!silent && screen === 'play' && S && S.at) renderPlay(false); }
}

function render() {
  closeMenu(true);
  if (screen === 'play' && S && S.at) renderPlay(false);
  else if (screen === 'setup') renderSetup();
  else if (screen === 'trophies') renderTrophies();
  else { screen = 'title'; renderTitle(); }
  updateTopbar();
}

// ---------- Global controls ----------
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if ($('#menu')) { if (e.key === 'Escape') closeMenu(); return; }
  if (e.key === 'Escape' && screen === 'play') { openMenu(); return; }
  if (mini && mini.key) { if (mini.key(e)) e.preventDefault(); return; }
  if (screen !== 'play' && screen !== 'trophies') return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) {
    const b = $$('[data-k]:not([disabled])', $('#screen')).find(x => x.dataset.k === String(n));
    if (b) { e.preventDefault(); b.click(); }
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && (!document.activeElement || document.activeElement === document.body)) {
    const ch = $$('#choices .choice');
    if (ch.length === 1) { e.preventDefault(); ch[0].click(); }
  }
});
$('#soundBtn').addEventListener('click', e => {
  const on = Sound.toggle();
  e.currentTarget.textContent = on ? 'Sound on' : 'Sound off';
  e.currentTarget.setAttribute('aria-pressed', String(on));
  Sound.play('click');
});
$('#soundBtn').textContent = Sound.on ? 'Sound on' : 'Sound off';
$('#soundBtn').setAttribute('aria-pressed', String(Sound.on));
$('#menuBtn').addEventListener('click', () => { Sound.play('click'); openMenu(); });
$('#brandBtn').addEventListener('click', () => { Sound.play('click'); showTitle(); });

// Small hook so automated tests can drive the game.
window.__undrafted = {
  get state() { return S; },
  get screen() { return screen; },
  finishMini(r) { if (mini && mini.finish) mini.finish(r); },
};

// ---------- Boot ----------
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ S, screen })); } catch (e) { /* ignore */ } }
function boot(data) {
  if (data && data.S) { S = data.S; screen = data.screen || 'title'; }
  else { S = loadSave(); screen = 'title'; }
  render();
}
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot(hot && hot.data);
})();
</script>
</body>
</html>
