name: Refresh week leaders, trade-calculator extras, and predictions

on:
  schedule:
    - cron: '45 * * * *' # hourly, at :45 - week boxscore fetches + team schedules/news are all ESPN endpoints, no CFBD quota involved
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-week-trade
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node src/generate-week-fantasy.js
      - run: node src/generate-trade-extras.js
      - run: node src/generate-predictions.js
      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/fantasy docs/data/predictions
          if git diff --cached --quiet; then
            echo "No week-leader, trade-calculator, or prediction changes."
          else
            git commit -m "Auto-refresh week leaders, trade-calculator extras, and predictions"
            git pull --rebase
            git push
          fi
