name: Refresh CFB fantasy leaderboards

on:
  schedule:
    - cron: '35 */3 * * *' # every 3 hours, at :35 - shares CFBD's 1,000/month quota with refresh-stats-cfb.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-fantasy-cfb
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node src/generate-fantasy.js cfb
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/fantasy
          if git diff --cached --quiet; then
            echo "No fantasy stat changes."
          else
            git commit -m "Auto-refresh CFB fantasy leaderboards"
            git pull --rebase
            git push
          fi
