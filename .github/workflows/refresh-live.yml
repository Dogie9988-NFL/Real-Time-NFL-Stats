name: Refresh live scoreboard

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node src/generate-live.js
      - run: node src/generate-live-fantasy.js
      - name: Commit and push if live data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/live.json docs/data/live-fantasy.json
          if git diff --cached --quiet; then
            echo "No live-game changes."
          else
            git commit -m "Auto-refresh live scoreboard and live fantasy scoring"
            git pull --rebase
            git push
          fi
